<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App - WhatsApp Style</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ece5dd;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #efeae2;
    border-radius: 10px;
    width: 100%;
    max-width: 480px;
    margin: auto;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }

  .input-box {
    display: flex;
    padding: 10px;
    background: #f0f0f0;
  }

  .input-box input {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
    border-radius: 20px;
  }

  .input-box button {
    margin-left: 10px;
    background: #128c7e;
    color: white;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
  }

  .input-box button:hover {
    background: #0d7568;
  }
</style>
</head>
<body>
  <div class="chat-container">
    <div id="messages"></div>

    <div class="input-box">
      <input id="msgInput" type="text" placeholder="Type a message...">
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, query, orderBy, onSnapshot, 
      serverTimestamp, updateDoc, doc, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // 🔥 Your Firebase Config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dummy users for demo
    const chatId = "demoChat";
    const me = { uid: "user1", name: "Rishu" };
    const friend = { uid: "user2", name: "Amit" };

    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    // --- Send Message ---
    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      await addDoc(collection(db, 'privateChats', chatId, 'messages'), {
        senderUid: me.uid,
        text,
        timestamp: serverTimestamp(),
        seenBy: [me.uid] // mark as seen by sender
      });

      input.value = '';
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => {
      if (e.key === 'Enter') sendMessage();
    });

    // --- Mark as seen ---
    async function markSeen(docId) {
      const msgRef = doc(db, 'privateChats', chatId, 'messages', docId);
      await updateDoc(msgRef, { seenBy: arrayUnion(me.uid) });
    }

    // --- Load Messages ---
    function loadMessages(chatId) {
      const msgQ = query(collection(db, 'privateChats', chatId, 'messages'), orderBy('timestamp'));
      onSnapshot(msgQ, snap => {
        messagesDiv.innerHTML = '';

        snap.forEach(d => {
          const m = d.data();
          const div = document.createElement('div');
          div.style.margin = '6px 0';
          div.style.padding = '10px 12px';
          div.style.borderRadius = '10px';
          div.style.maxWidth = '70%';
          div.style.wordWrap = 'break-word';
          div.style.background = (m.senderUid === me.uid) ? '#18ab91' : '#e9ecef';
          div.style.color = (m.senderUid === me.uid) ? '#fff' : '#000';
          div.style.alignSelf = (m.senderUid === me.uid) ? 'flex-end' : 'flex-start';

          // --- Text ---
          const msgText = document.createElement('div');
          msgText.textContent = m.text;

          // --- Time ---
          let timeText = '';
          if (m.timestamp?.toDate) {
            const ts = m.timestamp.toDate();
            const hours = ts.getHours() % 12 || 12;
            const minutes = ts.getMinutes().toString().padStart(2, '0');
            const ampm = ts.getHours() >= 12 ? 'PM' : 'AM';
            timeText = `${hours}:${minutes} ${ampm}`;
          }

          const msgTime = document.createElement('div');
          msgTime.style.fontSize = '11px';
          msgTime.style.opacity = '0.9';
          msgTime.style.textAlign = 'right';
          msgTime.style.display = 'flex';
          msgTime.style.justifyContent = 'flex-end';
          msgTime.style.alignItems = 'center';
          msgTime.style.gap = '3px';

          const timeSpan = document.createElement('span');
          timeSpan.textContent = timeText;

          // --- Ticks ---
          if (m.senderUid === me.uid) {
            const tickSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            tickSvg.setAttribute('width', '14');
            tickSvg.setAttribute('height', '14');
            tickSvg.setAttribute('viewBox', '0 0 24 24');

            const path1 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path1.setAttribute('d', 'M1.5 13l4.5 4.5L15 8.5');
            path1.setAttribute('fill', 'none');
            path1.setAttribute('stroke-width', '2');
            path1.setAttribute('stroke-linecap', 'round');
            path1.setAttribute('stroke-linejoin', 'round');

            const path2 = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path2.setAttribute('d', 'M9 13l4.5 4.5L22.5 8.5');
            path2.setAttribute('fill', 'none');
            path2.setAttribute('stroke-width', '2');
            path2.setAttribute('stroke-linecap', 'round');
            path2.setAttribute('stroke-linejoin', 'round');

            const seenByOthers = (m.seenBy || []).filter(uid => uid !== me.uid);
            const color = seenByOthers.length > 0 ? '#34b7f1' : '#ccc';
            path1.setAttribute('stroke', color);
            path2.setAttribute('stroke', color);

            tickSvg.appendChild(path1);
            tickSvg.appendChild(path2);

            msgTime.appendChild(timeSpan);
            msgTime.appendChild(tickSvg);
          } else {
            msgTime.appendChild(timeSpan);
            markSeen(d.id);
          }

          div.appendChild(msgText);
          div.appendChild(msgTime);
          messagesDiv.appendChild(div);
        });

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    loadMessages(chatId);
  </script>
</body>
</html>
