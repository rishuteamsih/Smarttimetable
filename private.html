<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Private Chat</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, where, onSnapshot,
      doc, getDoc, setDoc, orderBy, serverTimestamp, getDocs, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "AIzaSyAFKmM22FUSQPYy-eMsBzcZN3bmAxglXl0",
      authDomain: "smart-timetable-266fe.firebaseapp.com",
      projectId: "smart-timetable-266fe",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let me = JSON.parse(localStorage.getItem("chatUser") || "{}");
    let currentChatId = null;

    // --- UI Setup ---
    document.head.insertAdjacentHTML('beforeend', `
      <style>
        body{font-family:Arial;background:#f5f7fa;margin:0;display:flex;height:100vh}
        header{padding:14px;text-align:center;background:#18ab91;color:#fff}
        #sidebar{width:30%;border-right:1px solid #ddd;display:flex;flex-direction:column}
        #chatList{flex:1;overflow:auto;padding:10px;background:#fff}
        .chatItem{padding:10px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
        .chatItem:hover{background:#eafaf6}
        .unreadCount{background:#18ab91;color:#fff;border-radius:50%;padding:4px 8px;font-size:12px}
        #main{flex:1;display:flex;flex-direction:column}
        #messages{flex:1;overflow:auto;padding:12px;margin:12px;background:#fff;border-radius:8px;border:1px solid #ddd;display:flex;flex-direction:column}
        #inputBar{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd}
        input{flex:1;padding:10px;border-radius:999px;border:1px solid #ccc}
        button{padding:10px 14px;border-radius:999px;border:none;background:#18ab91;color:#fff}
      </style>
    `);

    document.body.insertAdjacentHTML('beforeend', `
      <div id="sidebar">
        <header>
          <h3>Chats</h3>
          <button id="logoutBtn" style="background:#fff;color:#18ab91;border:none;cursor:pointer;">Logout</button>
        </header>
        <div id="search">
          <input id="searchEmail" placeholder="Search by email..." style="width:70%;margin:10px" />
          <button id="findBtn">Find</button>
        </div>
        <div id="chatList"></div>
      </div>
      <div id="main">
        <header><h3 id="chatHeader">Private Chat</h3></header>
        <div id="messages"></div>
        <div id="inputBar">
          <input id="msgInput" placeholder="Type message..." />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    `);

    const chatListDiv = document.getElementById('chatList');
    const messagesDiv = document.getElementById('messages');
    const chatHeader = document.getElementById('chatHeader');

    // --- Authentication ---
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      me = { uid: user.uid, email: user.email, name: user.displayName || "Anonymous" };
      localStorage.setItem("chatUser", JSON.stringify(me));

      await setDoc(doc(db, "users", me.uid), {
        uid: me.uid, email: me.email, name: me.name, updated: serverTimestamp()
      }, { merge: true });

      watchChatList();
    });

    document.getElementById('logoutBtn').onclick = async () => {
      await signOut(auth);
      localStorage.removeItem('chatUser');
      window.location.href = "login.html";
    };

    // --- Watch all private chats (live) ---
    function watchChatList() {
      const q = query(collection(db, 'privateChats'), where('members', 'array-contains', me.uid));
      onSnapshot(q, async (snap) => {
        chatListDiv.innerHTML = '';
        if (snap.empty) {
          chatListDiv.innerHTML = "<p style='padding:10px;color:#888;'>No chats yet</p>";
          return;
        }

        for (const docSnap of snap.docs) {
          const chatId = docSnap.id;
          const data = docSnap.data();
          const otherUid = data.members.find(uid => uid !== me.uid);
          const userDoc = await getDoc(doc(db, "users", otherUid));
          const userData = userDoc.exists() ? userDoc.data() : { email: "Unknown user" };

          // Get unread count
          const msgsRef = collection(db, "privateChats", chatId, "messages");
          const msgsSnap = await getDocs(query(msgsRef, orderBy("timestamp", "desc")));
          let unreadCount = 0;
          let lastMessage = "";
          msgsSnap.forEach(m => {
            const msg = m.data();
            if (!msg.seenBy?.includes(me.uid)) unreadCount++;
            if (!lastMessage) lastMessage = msg.text;
          });

          const div = document.createElement('div');
          div.className = "chatItem";
          div.innerHTML = `
            <div>
              <b>${userData.name || userData.email}</b><br>
              <small>${lastMessage || ''}</small>
            </div>
            ${unreadCount > 0 ? `<span class="unreadCount">${unreadCount}</span>` : ''}
          `;
          div.onclick = () => startPrivateChat(chatId, otherUid, userData.name || userData.email);
          chatListDiv.appendChild(div);
        }
      });
    }

    // --- Start Chat ---
    async function startPrivateChat(chatId, friendUid, friendName) {
      currentChatId = chatId;
      chatHeader.textContent = friendName;
      loadMessages(chatId);

      // Mark all messages as seen
      const msgsRef = collection(db, 'privateChats', chatId, 'messages');
      const snap = await getDocs(msgsRef);
      snap.forEach(async (d) => {
        const data = d.data();
        if (!data.seenBy?.includes(me.uid)) {
          await updateDoc(d.ref, { seenBy: [...(data.seenBy || []), me.uid] });
        }
      });
    }

    // --- Load chat messages ---
    function loadMessages(chatId) {
      const msgQ = query(collection(db, 'privateChats', chatId, 'messages'), orderBy('timestamp'));
      onSnapshot(msgQ, snap => {
        messagesDiv.innerHTML = '';
        snap.forEach(d => {
          const m = d.data();
          const div = document.createElement('div');
          div.style.margin='6px 0';
          div.style.padding='8px';
          div.style.borderRadius='10px';
          div.style.maxWidth='70%';
          div.style.background = (m.senderUid === me.uid) ? '#18ab91' : '#e9ecef';
          div.style.color = (m.senderUid === me.uid) ? '#fff' : '#000';
          div.style.alignSelf = (m.senderUid === me.uid) ? 'flex-end' : 'flex-start';
          div.textContent = m.text;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    // --- Send message ---
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const t = document.getElementById('msgInput').value.trim();
      if (!t) return;
      if (!currentChatId) return alert('Select or start a chat first.');

      await addDoc(collection(db, 'privateChats', currentChatId, 'messages'), {
        senderUid: me.uid,
        text: t,
        timestamp: serverTimestamp(),
        seenBy: [me.uid]
      });
      document.getElementById('msgInput').value = '';
    });

    // --- Search user ---
    document.getElementById('findBtn').addEventListener('click', async () => {
      const email = document.getElementById('searchEmail').value.trim().toLowerCase();
      if (!email) return alert('Enter email');
      const q = query(collection(db, 'users'), where('email', '==', email));
      const snap = await getDocs(q);
      if (snap.empty) return alert('No user found with that email');

      const userDoc = snap.docs[0].data();
      const friendUid = snap.docs[0].id;
      if (friendUid === me.uid) return alert("You can't chat with yourself!");
      const chatId = [me.uid, friendUid].sort().join('_');
      await setDoc(doc(db, 'privateChats', chatId), { members: [me.uid, friendUid], created: serverTimestamp() }, { merge: true });
      startPrivateChat(chatId, friendUid, userDoc.name || userDoc.email);
    });
  </script>
</head>
<body></body>
</html>
