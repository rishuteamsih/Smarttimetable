<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Private Chat</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, where, getDocs,
      doc, getDoc, setDoc, orderBy, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAFKmM22FUSQPYy-eMsBzcZN3bmAxglXl0",
      authDomain: "smart-timetable-266fe.firebaseapp.com",
      projectId: "smart-timetable-266fe",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const me = JSON.parse(localStorage.getItem("chatUser") || "{}");
    if (!me.uid) { document.write('<p>Please login via SmartTimetable first.</p>'); throw 'not-login'; }

    document.head.insertAdjacentHTML('beforeend', `
      <style>
        body{font-family:Arial;background:#f5f7fa;margin:0}
        header{padding:14px;text-align:center;background:#18ab91;color:#fff}
        #search{padding:12px}
        #messages{height:55vh;overflow:auto;padding:12px;margin:12px;background:#fff;border-radius:8px;border:1px solid #ddd}
        #inputBar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px}
        input{flex:1;padding:10px;border-radius:999px;border:1px solid #ccc}
        button{padding:10px 14px;border-radius:999px;border:none;background:#18ab91;color:#fff}
      </style>
    `);

    document.body.insertAdjacentHTML('beforeend', `
      <header><h2>Private Chat</h2></header>
      <div id="search">
        <input id="searchEmail" placeholder="Enter friend's college email (example@college.edu)" />
        <button id="findBtn">Find & Start Chat</button>
      </div>
      <div id="messages"></div>
      <div id="inputBar">
        <input id="msgInput" placeholder="Type message..." />
        <button id="sendBtn">Send</button>
      </div>
    `);

    let currentChatId = null;
    const messagesDiv = document.getElementById('messages');

    document.getElementById('findBtn').addEventListener('click', async () => {
      const email = document.getElementById('searchEmail').value.trim().toLowerCase();
      if (!email) return alert('Enter email');
      const q = query(collection(db,'users'), where('email','==', email));
      const snap = await getDocs(q);
      if (snap.empty) return alert('No user found with that email');
      const userDoc = snap.docs[0].data();
      const friendUid = snap.docs[0].id;
      startPrivateChat(friendUid, userDoc.name || userDoc.email);
    });

    async function startPrivateChat(friendUid, friendName) {
      // chat id uses sorted uids to keep single chat per pair
      const chatId = [me.uid, friendUid].sort().join('_');
      currentChatId = chatId;

      // ensure chat doc exists with members array
      const chatDocRef = doc(db, 'privateChats', chatId);
      const chatSnap = await getDoc(chatDocRef);
      if (!chatSnap.exists()) {
        await setDoc(chatDocRef, { members: [me.uid, friendUid], created: serverTimestamp() });
      }

      // listen to messages
      const msgQ = query(collection(db, 'privateChats', chatId, 'messages'), orderBy('timestamp'));
      onSnapshot(msgQ, snap => {
        messagesDiv.innerHTML = '';
        snap.forEach(d => {
          const m = d.data();
          const cls = (m.senderUid === me.uid) ? 'mine' : 'theirs';
          const div = document.createElement('div');
          div.className = cls;
          div.style.margin='6px 0';
          div.style.padding='8px';
          div.style.borderRadius='10px';
          div.style.background = (m.senderUid === me.uid) ? '#18ab91' : '#e9ecef';
          div.style.color = (m.senderUid === me.uid) ? '#fff' : '#000';
          div.textContent = m.text;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    document.getElementById('sendBtn').addEventListener('click', async ()=> {
      const t = document.getElementById('msgInput').value.trim();
      if (!t) return;
      if (!currentChatId) return alert('Start a chat first (search by email).');
      await addDoc(collection(db, 'privateChats', currentChatId, 'messages'), {
        senderUid: me.uid,
        text: t,
        timestamp: serverTimestamp()
      });
      document.getElementById('msgInput').value='';
    });
  </script>
</head>
<body></body>
</html>
