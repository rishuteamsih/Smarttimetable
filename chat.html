<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Global College Chat</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Use your existing Firebase config (same as in your index file)
    const firebaseConfig = {
      apiKey: "AIzaSyAFKmM22FUSQPYy-eMsBzcZN3bmAxglXl0",
      authDomain: "smart-timetable-266fe.firebaseapp.com",
      projectId: "smart-timetable-266fe",
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const me = JSON.parse(localStorage.getItem("chatUser") || "{}");

    // helper: show message if not logged-in
    if (!me.uid) {
      document.write('<p style="padding:20px;">Please login via SmartTimetable first (open from the dashboard).</p>');
      throw new Error("not-logged-in");
    }

    // render HTML
    document.head.insertAdjacentHTML('beforeend', `
      <style>
        body{font-family:Arial;margin:0;background:#f5f7fa}
        header{padding:14px;text-align:center;background:#18ab91;color:#fff}
        #messages{height:60vh;overflow:auto;padding:12px;margin:12px;background:#fff;border-radius:8px;border:1px solid #ddd}
        .msg{margin:6px 0;padding:8px;border-radius:12px;display:block}
        .meta{font-size:12px;color:#666}
        #emojiBar{padding:8px;text-align:center}
        #inputBar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px}
        input{flex:1;padding:10px;border-radius:999px;border:1px solid #ccc}
        button{padding:10px 14px;border-radius:999px;border:none;background:#18ab91;color:#fff}
        .mine{background:#18ab91;color:#fff;align-self:flex-end}
        .theirs{background:#e9ecef;color:#000;}
      </style>
    `);

    document.body.insertAdjacentHTML('beforeend', `
      <header><h2>Campus Chat</h2></header>
      <div id="messages"></div>
      <div id="emojiBar"></div>
      <div id="inputBar">
        <input id="messageInput" placeholder="Message or pick an emoji..." />
        <button id="sendBtn">Send</button>
      </div>
    `);

    // emoji set (10 emojis)
    const emojis = ['😀','😂','😎','😍','😢','😡','🤔','🙌','🔥','👍'];
    const emojiBar = document.getElementById('emojiBar');
    emojis.forEach(e => {
      const span = document.createElement('span');
      span.textContent = e;
      span.style.cursor = 'pointer';
      span.style.padding = '6px';
      span.style.fontSize = '20px';
      span.addEventListener('click', ()=> {
        const input = document.getElementById('messageInput');
        input.value += e;
        input.focus();
      });
      emojiBar.appendChild(span);
    });

    const messagesDiv = document.getElementById('messages');
    const q = query(collection(db, 'globalChat'), orderBy('timestamp'));
    onSnapshot(q, snap => {
      messagesDiv.innerHTML = '';
      snap.forEach(doc => {
        const m = doc.data();
        const div = document.createElement('div');
        div.className = 'msg ' + (m.senderUid === me.uid ? 'mine' : 'theirs');
        div.innerHTML = `<div class="meta">${escapeHtml(m.senderName || m.senderEmail || 'User')}</div>
                         <div>${escapeHtml(m.text)}</div>`;
        messagesDiv.appendChild(div);
      });
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    document.getElementById('sendBtn').addEventListener('click', async () => {
      const text = document.getElementById('messageInput').value.trim();
      if (!text) return;
      await addDoc(collection(db, 'globalChat'), {
        senderUid: me.uid,
        senderName: me.name || '',
        senderEmail: me.email || '',
        text,
        timestamp: serverTimestamp()
      });
      document.getElementById('messageInput').value = '';
    });

    function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
  </script>
</head>
<body></body>
</html>
